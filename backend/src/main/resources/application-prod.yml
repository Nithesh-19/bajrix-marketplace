server:
  port: ${PORT:8085}

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    com.bajrix: INFO
